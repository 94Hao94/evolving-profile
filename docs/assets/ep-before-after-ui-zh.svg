<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex、Claude Desktop 原生长期记忆与接入 Evolving Profile 的真实界面风格对比</title>
  <desc id="desc">左侧模拟 Codex 桌面端和 Claude Desktop 各自的原生长期记忆，右侧模拟同样入口接入 EP 后出现的 MCP 工具、来源回读和修复回执。</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef2f6"/><stop offset="1" stop-color="#dbe4ed"/></linearGradient>
    <linearGradient id="codex" x1="0" x2="1"><stop offset="0" stop-color="#252832"/><stop offset="1" stop-color="#171920"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1727" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#page)"/>
  <text x="48" y="54" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="800" fill="#172234">Codex、Claude Desktop 原生记忆 vs EP 证据层</text>
  <text x="48" y="84" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#607086">真实入口风格的概念模拟：参考 Codex 桌面端、Claude Desktop 和网页控制台，不是实际截图</text>
