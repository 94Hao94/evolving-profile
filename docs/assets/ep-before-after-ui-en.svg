<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex and Claude Desktop native memory compared with Codex and Claude Desktop connected to Evolving Profile</title>
  <desc id="desc">A realistic concept mockup of Codex desktop and Claude Desktop. The left side shows each host's native long-term memory as host-scoped and opaque. The right side shows the same host surfaces connected to EP tools and an evidence rail with source, repair, queue and backup receipts.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef2f6"/><stop offset="1" stop-color="#dbe4ed"/></linearGradient>
    <linearGradient id="codex" x1="0" x2="1"><stop offset="0" stop-color="#252832"/><stop offset="1" stop-color="#171920"/></linearGradient>
    <linearGradient id="ep" x1="0" x2="1"><stop offset="0" stop-color="#0d1d31"/><stop offset="1" stop-color="#122b3d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1727" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#page)"/>
  <text x="48" y="54" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#172234">Native host memory vs EP evidence plane</text>
  <text x="48" y="84" font-family="Inter,Arial,sans-serif" font-size="15" fill="#607086">Realistic surface mockup — based on the visual grammar of Codex desktop, Claude Desktop and a browser console; not a live screenshot</text>
  <rect x="48" y="112" width="744" height="744" rx="22" fill="#f7f9fb" stroke="#ccd6e0"/>
  <rect x="808" y="112" width="744" height="744" rx="22" fill="#f7fbfc" stroke="#8ac7c1" stroke-width="2"/>
  <text x="78" y="154" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1.4" fill="#a64c48">WITHOUT EP · NATIVE MEMORY ONLY</text>
  <text x="838" y="154" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1.4" fill="#147e7b">WITH EP · SAME HOSTS + EVIDENCE PLANE</text>

  <!-- Codex native window -->
  <g filter="url(#shadow)">
    <rect x="78" y="180" width="684" height="290" rx="13" fill="#1e2027"/>
    <rect x="78" y="180" width="684" height="34" rx="13" fill="#2a2d36"/>
    <circle cx="98" cy="197" r="5" fill="#ff6b61"/><circle cx="116" cy="197" r="5" fill="#ffc04b"/><circle cx="134" cy="197" r="5" fill="#47c95b"/>
    <text x="165" y="202" font-family="Inter,Arial,sans-serif" font-size="13" fill="#d8dce5" font-weight="700">Codex</text>
    <rect x="78" y="214" width="174" height="256" fill="#242730"/>
    <text x="98" y="243" font-family="Inter,Arial,sans-serif" font-size="12" fill="#8d95a4">PROJECTS</text>
    <text x="98" y="270" font-family="Inter,Arial,sans-serif" font-size="13" fill="#edf0f6">EP release docs</text>
    <text x="98" y="297" font-family="Inter,Arial,sans-serif" font-size="13" fill="#9da5b5">Course outline</text>
    <text x="98" y="324" font-family="Inter,Arial,sans-serif" font-size="13" fill="#9da5b5">Backup repair</text>
    <text x="98" y="361" font-family="Inter,Arial,sans-serif" font-size="12" fill="#8d95a4">MEMORY</text>
    <rect x="94" y="376" width="142" height="25" rx="7" fill="#343946"/><text x="106" y="393" font-family="Inter,Arial,sans-serif" font-size="11" fill="#d7dbe4">native memory · on</text>
    <rect x="272" y="238" width="466" height="56" rx="11" fill="#313541"/><text x="292" y="263" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9aa4b4">You</text><text x="292" y="282" font-family="Inter,Arial,sans-serif" font-size="14" fill="#eef1f6">Continue the AI course outline.</text>
    <rect x="272" y="310" width="466" height="78" rx="11" fill="#252933" stroke="#3f4554"/><text x="292" y="337" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9aa4b4">Codex</text><text x="292" y="359" font-family="Inter,Arial,sans-serif" font-size="14" fill="#d9dee8">I remember some context, but I cannot show</text><text x="292" y="379" font-family="Inter,Arial,sans-serif" font-size="14" fill="#d9dee8">which source or revision supplied it.</text>
    <rect x="272" y="407" width="198" height="25" rx="7" fill="#3f3032"/><text x="285" y="424" font-family="Inter,Arial,sans-serif" font-size="11" fill="#efaaa4">scope / freshness unknown</text>
  </g>

  <!-- Claude native window -->
  <g filter="url(#shadow)">
    <rect x="78" y="504" width="684" height="290" rx="13" fill="#f5f0e8"/>
    <rect x="78" y="504" width="684" height="35" rx="13" fill="#e9e0d5"/>
    <circle cx="98" cy="521" r="5" fill="#c9a18b"/><circle cx="116" cy="521" r="5" fill="#d6b29e"/><circle cx="134" cy="521" r="5" fill="#b99783"/>
    <text x="165" y="526" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5f5047" font-weight="700">Claude Desktop</text>
    <rect x="78" y="539" width="174" height="255" fill="#eee7de"/>
    <text x="98" y="568" font-family="Inter,Arial,sans-serif" font-size="12" fill="#8c7d70">CHATS</text><text x="98" y="596" font-family="Inter,Arial,sans-serif" font-size="13" fill="#463a35">Course outline</text><text x="98" y="623" font-family="Inter,Arial,sans-serif" font-size="13" fill="#87796e">Memory setup</text><text x="98" y="650" font-family="Inter,Arial,sans-serif" font-size="13" fill="#87796e">Release notes</text>
    <rect x="94" y="689" width="142" height="25" rx="7" fill="#e1d6c9"/><text x="106" y="706" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6c5b50">long-term memory · local</text>
    <rect x="272" y="559" width="466" height="56" rx="11" fill="#fffaf4" stroke="#e1d6c9"/><text x="292" y="583" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9b806d">You</text><text x="292" y="603" font-family="Inter,Arial,sans-serif" font-size="14" fill="#443832">Continue the AI course outline.</text>
    <rect x="272" y="630" width="466" height="78" rx="11" fill="#f1e8de"/><text x="292" y="657" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9b806d">Claude</text><text x="292" y="679" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b493d">I may have a memory, but its origin and</text><text x="292" y="699" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b493d">cross-agent identity are not visible here.</text>
    <rect x="272" y="731" width="248" height="25" rx="7" fill="#ead9ce"/><text x="285" y="748" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8f614e">no repair / queue receipt in Chat</text>
  </g>

  <!-- Codex + EP -->
  <g filter="url(#shadow)">
    <rect x="838" y="180" width="684" height="272" rx="13" fill="url(#codex)"/>
    <rect x="838" y="180" width="684" height="34" rx="13" fill="#2a2d36"/><circle cx="858" cy="197" r="5" fill="#ff6b61"/><circle cx="876" cy="197" r="5" fill="#ffc04b"/><circle cx="894" cy="197" r="5" fill="#47c95b"/><text x="925" y="202" font-family="Inter,Arial,sans-serif" font-size="13" fill="#d8dce5" font-weight="700">Codex</text>
    <rect x="838" y="214" width="174" height="238" fill="#242730"/><text x="858" y="244" font-family="Inter,Arial,sans-serif" font-size="12" fill="#8d95a4">TOOLS</text><rect x="854" y="260" width="142" height="28" rx="7" fill="#294c55"/><text x="866" y="279" font-family="Inter,Arial,sans-serif" font-size="11" fill="#b7fff0">EP · user_recall</text><text x="858" y="320" font-family="Inter,Arial,sans-serif" font-size="12" fill="#8d95a4">PROJECT</text><text x="858" y="346" font-family="Inter,Arial,sans-serif" font-size="13" fill="#edf0f6">Course outline</text>
    <rect x="1032" y="239" width="466" height="58" rx="11" fill="#313541"/><text x="1052" y="264" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9aa4b4">You</text><text x="1052" y="284" font-family="Inter,Arial,sans-serif" font-size="14" fill="#eef1f6">Continue the AI course outline.</text>
    <rect x="1032" y="313" width="466" height="76" rx="11" fill="#203d48" stroke="#4fb6aa"/><text x="1052" y="339" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9ee9d9">Codex + EP</text><text x="1052" y="361" font-family="Inter,Arial,sans-serif" font-size="14" fill="#e4fff9">Matched session · source readback required</text><text x="1052" y="381" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9bc9ca">preference: lead with result, then evidence</text>
    <rect x="1032" y="406" width="240" height="25" rx="7" fill="#173b3e"/><text x="1045" y="423" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8df0d8">receipt · source linked</text>
  </g>

  <!-- Claude + EP -->
  <g filter="url(#shadow)">
    <rect x="838" y="486" width="684" height="272" rx="13" fill="#f5f0e8"/>
    <rect x="838" y="486" width="684" height="35" rx="13" fill="#e9e0d5"/><circle cx="858" cy="503" r="5" fill="#c9a18b"/><circle cx="876" cy="503" r="5" fill="#d6b29e"/><circle cx="894" cy="503" r="5" fill="#b99783"/><text x="925" y="508" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5f5047" font-weight="700">Claude Desktop</text>
    <rect x="838" y="521" width="174" height="237" fill="#eee7de"/><text x="858" y="550" font-family="Inter,Arial,sans-serif" font-size="12" fill="#8c7d70">MCP SERVERS</text><rect x="854" y="566" width="142" height="28" rx="7" fill="#d9eee9"/><text x="866" y="585" font-family="Inter,Arial,sans-serif" font-size="11" fill="#176d67">evolving-profile</text><text x="858" y="626" font-family="Inter,Arial,sans-serif" font-size="12" fill="#8c7d70">CHAT</text><text x="858" y="652" font-family="Inter,Arial,sans-serif" font-size="13" fill="#463a35">Course outline</text>
    <rect x="1032" y="545" width="466" height="58" rx="11" fill="#fffaf4" stroke="#e1d6c9"/><text x="1052" y="570" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9b806d">You</text><text x="1052" y="590" font-family="Inter,Arial,sans-serif" font-size="14" fill="#443832">Continue the AI course outline.</text>
    <rect x="1032" y="619" width="466" height="76" rx="11" fill="#e4f4ef" stroke="#82c8bb"/><text x="1052" y="645" font-family="Inter,Arial,sans-serif" font-size="12" fill="#438077">Claude + EP</text><text x="1052" y="667" font-family="Inter,Arial,sans-serif" font-size="14" fill="#31554f">EP found the project and checked the source.</text><text x="1052" y="687" font-family="Inter,Arial,sans-serif" font-size="12" fill="#5b847d">cross-agent origin · repair state · delivery receipt</text>
    <rect x="1032" y="712" width="270" height="25" rx="7" fill="#d9eee9"/><text x="1045" y="729" font-family="Inter,Arial,sans-serif" font-size="11" fill="#176d67">completed · adoption still unverified</text>
  </g>

  <text x="838" y="820" font-family="Inter,Arial,sans-serif" font-size="13" fill="#4c6f7b">EP does not erase native memory. It adds source-linked scope, cross-agent identity, repair evidence and terminal receipts.</text>
</svg>
